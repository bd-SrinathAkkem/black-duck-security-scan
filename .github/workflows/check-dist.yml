name: Check dist/

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  check-dist:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies
        run: npm ci

      - name: Rebuild the dist/ directory
        run: |
          export NODE_OPTIONS=--openssl-legacy-provider
          npm run build && npm run package

      - name: Compare the expected and actual dist/ directories
        run: |
          if [ "$(git diff --ignore-space-at-eol dist/ | wc -l)" -gt "0" ]; then
            echo "Detected uncommitted changes after build.  See status below:"
            git diff
            exit 1
          fi
        id: diff

      - name: Run tests and collect results
        id: results
        run: |
          npm test -- --json --outputFile=test.json || true
          npm test -- --coverage --collectCoverageFrom='src/**/*.{ts,jxs}' --coverageReporters=json-summary || true
          echo "passed=$(jq '.numPassedTests' test.json)" >> $GITHUB_OUTPUT
          echo "failed=$(jq '.numFailedTests' test.json)" >> $GITHUB_OUTPUT
          echo "total=$(jq '.numTotalTests' test.json)" >> $GITHUB_OUTPUT
          echo "lines=$(jq '.total.lines.pct' coverage/coverage-summary.json)" >> $GITHUB_OUTPUT

      - name: Comment results on the PR
        run: |
          PR=$(jq -r .pull_request.number $GITHUB_EVENT_PATH)
          LINES=$(jq '.total.lines.pct' coverage/coverage-summary.json)
          echo '| File | % Stmts | % Branch | % Funcs | % Lines |' >> coverage-table.md
          echo '|------|---------|----------|---------|---------|' >> coverage-table.md
          jq -r '
            to_entries[] | select(.key != "total") |
            [
              (.key | gsub("^.*/src/"; "src/")),
              (.value.statements.pct | tostring),
              (.value.branches.pct | tostring),
              (.value.functions.pct | tostring),
              (.value.lines.pct | tostring)
            ] | "| " + join(" | ") + " |"
          ' coverage/coverage-summary.json >> coverage-table.md
          TOTAL=$(jq -r '
            .total as $t |
            [
              "All files",
              ($t.statements.pct | tostring),
              ($t.branches.pct | tostring),
              ($t.functions.pct | tostring),
              ($t.lines.pct | tostring)
            ] | "| " + join(" | ") + " |"
          ' coverage/coverage-summary.json)
          sed -i "2i\\
          $TOTAL
          " coverage-table.md
          BODY="## 🧪 Test & Coverage Results
      
          ![Tests](https://img.shields.io/badge/tests-${{ steps.results.outputs.passed }}_passed_${{ steps.results.outputs.failed }}_failed-blue)
          ![Coverage](https://img.shields.io/badge/coverage-${LINES}%25-brightgreen)
      
          <details>
          <summary>Show full coverage details</summary>
      
          $(cat coverage-table.md)
      
          </details>
          "
          CID=$(gh api repos/${{ github.repository }}/issues/$PR/comments --jq '.[] | select(.body|contains("## 🧪 Test & Coverage Results")) | .id' | head -n1)
          if [ -n "$CID" ]; then
            gh api repos/${{ github.repository }}/issues/comments/$CID -X PATCH -f body="$BODY"
          else
            gh api repos/${{ github.repository }}/issues/$PR/comments -f body="$BODY"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: ${{ failure() && steps.diff.conclusion == 'failure' }}
        with:
          name: dist
          path: dist/